services:
  postgres:
    image: postgres:16.8-alpine
    container_name: careeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - careeros_network

  redis:
    image: redis:7.4.2-alpine
    container_name: careeros-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command:
      - 'redis-server'
      - '--appendonly'
      - 'yes'
      - '--requirepass'
      - '${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}'
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - careeros_network

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: careeros-minio
    # Local-development-only: Running MinIO as root (0:0) is required for Docker Desktop
    # named volume write permissions on Windows/WSL2 host mounts.
    # Production deployments MUST use managed S3-compatible cloud storage (AWS S3/Cloudflare R2)
    # with least-privilege IAM roles and non-root execution per ARCHITECTURE.md.
    user: '0:0'
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - careeros_network

volumes:
  postgres_data:
    name: careeros_postgres_data
  redis_data:
    name: careeros_redis_data
  minio_data:
    name: careeros_minio_data

networks:
  careeros_network:
    name: careeros_network
    driver: bridge
