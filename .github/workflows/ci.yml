name: CI Quality Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Setup disposable CI environment
        run: cp .env.example .env

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build internal packages
        run: pnpm -r --filter "./packages/*" build

      - name: Gate 1 - Code Formatting Check
        run: pnpm format:check

      - name: Gate 2 - ESLint
        run: pnpm lint

      - name: Gate 3 - Type Check
        run: pnpm typecheck

      - name: Gate 4 - Production Dependency Security Audit
        run: pnpm audit --prod --audit-level=high

      - name: Start isolated PostgreSQL container
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL readiness
        run: |
          echo "Waiting for PostgreSQL service on port 5433..."
          MAX_ATTEMPTS=30
          ATTEMPT=0
          until docker compose exec -T postgres pg_isready -U careeros_local_user -d careeros_local_dev; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "ERROR: PostgreSQL service failed to become ready within ${MAX_ATTEMPTS} seconds."
              echo "=== Container Status ==="
              docker compose ps
              echo "=== PostgreSQL Logs (last 50 lines) ==="
              docker compose logs --tail=50 postgres
              exit 1
            fi
            sleep 1
          done
          echo "PostgreSQL is ready."

      - name: Gate 5 - Automated Tests (Unit & Database Integration)
        run: pnpm test

      - name: Gate 6 - Monorepo Build Verification
        run: pnpm build
